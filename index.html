<ul><li>8일 연속 하락(2008년 이후 최장) 뒤 저가매수 + 마이크론 \"대만 신공장 2027년 물량 완판\", 인텔 JPMorgan 투자의견 상향 → 마이크론·인텔·AMD·엔비디아 주도로 SOX +1.6%<\/li><li>AI 신용 불안은 안 풀림: CoreWeave 2032년 채권 수익률 ~14.9%, 주가는 소폭 하락, 오라클 CDS 315bp → 반도체가 시가보다 낮게 마감(SOXX $511→$502), 단 장중 반납의 단일 원인은 뚜렷하지 않음<\/li><li>10년물 다시 5.1%대 → 금리 민감주 약세, 다우 -0.07%로 반등이 기술주에만 한정<\/li><li>소음: \"엔비디아가 TSMC에 차세대 HBM 요청\" 보도는 단일 출처라 미확인. 후티의 사우디 공격 보도는 유가를 움직였지만 반도체와의 연결은 약함<\/li><\/ul>\n<h3>🇰🇷 한국은 (10/19 월)<\/h3>\n<p>코스피 +1.8% · 코스닥 +1.8% · 원/달러 1,330.3원 · 외국인 집계 엇갈림(뉴스핌 +6,247억 / 다른 보도 순매도 187억) · 삼성전자 +1.2% · SK하이닉스 +0.4%<\/p>\n<ul><li>금요일 미국 SOX -3.8%를 반영해 장 초반 코스피 -3.2%, 삼성·하이닉스 -4% 안팎 → 오후 기관 매수·외국인 매도 축소로 상승 마감<\/li><li>반등은 이차전지·자동차가 주도, 반도체는 소폭 상승에 그침. 10월 외국인 순매도 17.7조원 중 약 80%가 삼성·하이닉스<\/li><li>원/달러 1,330원은 2024년 10월 이후 최저(원화 강세) — 외국인 매도는 환율보다 반도체 자체 걱정 때문<\/li><li>오늘 오전(09:45) 코스피 -2.9%(5,601), 하이닉스 -3%대·삼성 -1%대, 외국인·기관 동반 순매도 — AI 인프라 부채 우려가 배경으로 거론됨<\/li><\/ul>\n<h3>🔁 미국→한국 전이<\/h3>\n<p>SOX -3.8% (10/16) → 하이닉스 +0.4% · 삼성전자 +1.2% (10/19) — 반대 방향. 오늘 아침도 SOX +1.6% 뒤 코스피 -2.9%로 또 반대예요. 3거래일 연속 한국이 미국과 따로 움직이며, 미국 뉴스보다 외국인 수급이 더 큰 변수가 됐어요.<\/p>\n<h3>✅ 조건 체크리스트<\/h3>\n<div class=\"table\"><table><thead><tr><th>조건<\/th><th>상태<\/th><th>오늘 수치<\/th><th>켜지면 의미<\/th><\/tr><\/thead><tbody><tr class=\"wait changed\"><td>$500 재이탈 (변경)<\/td><td>⚪ 대기<\/td><td>$501.93 (회복)<\/td><td>다시 깨지면 $465까지 열림<\/td><\/tr><tr class=\"off changed\"><td>원/달러 1,350 돌파 (변경)<\/td><td>✖️ 해제<\/td><td>1,330.3원<\/td><td>원화가 오히려 강세 — 의미 약해짐<\/td><\/tr><tr class=\"on\"><td>AI 기업 신용 스트레스 확산<\/td><td>🟢 켜짐<\/td><td>CoreWeave 채권 ~14.9%, 오라클 CDS 315bp<\/td><td>AI 투자 자금줄 걱정<\/td><\/tr><tr class=\"on\"><td>$531 이탈<\/td><td>🟢 켜짐<\/td><td>$501.93<\/td><td>50일선 아래, 약세 구간<\/td><\/tr><tr class=\"on\"><td>CXMT·메모리 압박<\/td><td>🟢 켜짐<\/td><td>새 보도 없음<\/td><td>메모리주 압박<\/td><\/tr><tr class=\"wait\"><td>$465 이탈<\/td><td>⚪ 대기<\/td><td>$501.93<\/td><td>올해 저점 붕괴, 하락 가속<\/td><\/tr><tr class=\"wait\"><td>$531 / $559 / $583 회복<\/td><td>⚪ 대기<\/td><td>한참 아래<\/td><td>단계별 반등 확인<\/td> <script>
(function () {
  var data = JSON.parse(document.getElementById("data").textContent);
  var dates = data.notes.map(function (n) { return n.date; });
  var sel = document.getElementById("date"), note = document.getElementById("note"), hist = document.getElementById("hist");
  var prev = document.getElementById("prev"), next = document.getElementById("next");
  dates.forEach(function (d) { var o = document.createElement("option"); o.value = d; o.textContent = d; sel.appendChild(o); });
  function show(d) {
    var i = dates.indexOf(d); if (i < 0) i = 0;
    note.innerHTML = data.notes[i].html; sel.value = dates[i];
    prev.disabled = i >= dates.length - 1; next.disabled = i <= 0;
    try { if (i === 0) history.replaceState(null, "", location.pathname); else location.hash = "d" + dates[i].replace(/-/g, ""); } catch (e) {}
  }
  sel.addEventListener("change", function () { show(sel.value); });
  prev.addEventListener("click", function () { show(dates[dates.indexOf(sel.value) + 1]); });
  next.addEventListener("click", function () { show(dates[dates.indexOf(sel.value) - 1]); });
  hist.innerHTML = data.history;
  var tn = document.getElementById("tab-note"), th = document.getElementById("tab-hist");
  function tab(h) { note.hidden = h; hist.hidden = !h; tn.setAttribute("aria-selected", String(!h)); th.setAttribute("aria-selected", String(h)); }
  tn.addEventListener("click", function () { tab(false); }); th.addEventListener("click", function () { tab(true); });
  var m = /^#d(\d{4})(\d{2})(\d{2})$/.exec(location.hash);
  show(m ? m[1] + "-" + m[2] + "-" + m[3] : dates[0]);
})();
</script>
