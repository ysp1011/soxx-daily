<script>
(function () {
  var data = JSON.parse(document.getElementById("data").textContent);
  var dates = data.notes.map(function (n) { return n.date; });
  var sel = document.getElementById("date"), note = document.getElementById("note"), hist = document.getElementById("hist");
  var prev = document.getElementById("prev"), next = document.getElementById("next");
  dates.forEach(function (d) { var o = document.createElement("option"); o.value = d; o.textContent = d; sel.appendChild(o); });
  function show(d) {
    var i = dates.indexOf(d); if (i < 0) i = 0;
    note.innerHTML = data.notes[i].html; sel.value = dates[i];
    prev.disabled = i >= dates.length - 1; next.disabled = i <= 0;
    try { if (i === 0) history.replaceState(null, "", location.pathname); else location.hash = "d" + dates[i].replace(/-/g, ""); } catch (e) {}
  }
  sel.addEventListener("change", function () { show(sel.value); });
  prev.addEventListener("click", function () { show(dates[dates.indexOf(sel.value) + 1]); });
  next.addEventListener("click", function () { show(dates[dates.indexOf(sel.value) - 1]); });
  hist.innerHTML = data.history;
  var tn = document.getElementById("tab-note"), th = document.getElementById("tab-hist");
  function tab(h) { note.hidden = h; hist.hidden = !h; tn.setAttribute("aria-selected", String(!h)); th.setAttribute("aria-selected", String(h)); }
  tn.addEventListener("click", function () { tab(false); }); th.addEventListener("click", function () { tab(true); });
  var m = /^#d(\d{4})(\d{2})(\d{2})$/.exec(location.hash);
  show(m ? m[1] + "-" + m[2] + "-" + m[3] : dates[0]);
})();
</script>
